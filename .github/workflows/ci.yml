name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  MEDUSA_DISABLE_TELEMETRY: "true"
  HUSKY: "0"

jobs:
  # 1. Fast checks: lint, types, unit tests, production builds.
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # 2. Backend API tests against a real Postgres.
  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # 3. Real browser tests (mobile + desktop) with the backend running.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoparts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/autoparts
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      JWT_SECRET: ci-only-not-secret
      COOKIE_SECRET: ci-only-not-secret
      MEDUSA_BACKEND_URL: http://localhost:9000
      E2E_EXPECT_BACKEND: connected
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate + seed database
        run: pnpm db:migrate
      - name: Start backend
        working-directory: apps/backend
        run: |
          nohup pnpm exec medusa develop > ../../backend.log 2>&1 &
          npx --yes wait-on --timeout 180000 http-get://localhost:9000/health
      - name: Build storefront
        run: pnpm --filter @autoparts/storefront build
      - name: Install Playwright browsers
        working-directory: apps/storefront
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run Playwright
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/test-results
            backend.log
          retention-days: 7

  # 6. Design system: every Storybook story rendered in Chromium; any axe violation fails.
  design-system:
    name: Design system (Storybook + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: packages/ui
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @autoparts/ui test:storybook

  # 7. Visual regression: screenshots of every story and of the prototype at 5 widths,
  #    inside the same Docker image used to create the baselines (scripts/visual-baselines.sh).
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: "1"
      HOME: /tmp
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --filter "@autoparts/storefront..." --filter "@autoparts/ui..."
      - run: pnpm --filter @autoparts/storefront build
      - run: pnpm --filter @autoparts/ui build:storybook
      - name: Prototype pages at 360–1440px
        working-directory: apps/storefront
        run: VISUAL=1 pnpm exec playwright test
      - name: Every Storybook story
        if: success() || failure()
        working-directory: packages/ui
        run: pnpm exec playwright test
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            apps/storefront/test-results
            packages/ui/test-results
          retention-days: 7

  # 8. Lighthouse on the prototype pages: accessibility must score >= 95.
  lighthouse:
    name: Lighthouse (accessibility ≥ 95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@autoparts/storefront..."
      - run: pnpm --filter @autoparts/storefront build
      - name: Run Lighthouse CI
        working-directory: apps/storefront
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Upload Lighthouse reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/storefront/.lighthouseci
          retention-days: 14

  # 4. Fail if any secret/API key is committed.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. PR titles/commits must follow Conventional Commits.
  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
