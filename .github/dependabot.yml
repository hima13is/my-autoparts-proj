version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      medusa:
        patterns: ["@medusajs/*"]
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      testing:
        patterns: ["@playwright/*", "@axe-core/*", "vitest", "jest", "@swc/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
